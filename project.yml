name: CSign
options:
  bundleIdPrefix: com.csign
  deploymentTarget:
    iOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.csign.app
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: CSign/Resources/Info.plist
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  CSign:
    type: application
    platform: iOS
    sources:
      - path: CSign
        excludes:
          - "**/*.md"
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.csign.app
        INFOPLIST_FILE: CSign/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        SWIFT_OBJC_BRIDGING_HEADER: ""
